<g text-anchor="middle" fill="#343a37">
 <text x="400" y="95" font-family="Georgia,serif" font-size="20" letter-spacing="8">REALIZE CLUB</text>
 <text x="400" y="338" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="110" font-weight="600" letter-spacing="17">人の道</text>
 <path d="M344 368h112" stroke="#9d8565" stroke-width="2" fill="none"/>
 <text x="400" y="435" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="33" letter-spacing="3">5領域・25テーマの教科書</text>
 <text x="400" y="517" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="46" letter-spacing="7">175日間の学び</text>
 <text x="400" y="578" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" font-size="22" letter-spacing="3" fill="#625e54">物語から学ぶ、日々の選択。</text>
</g>
<!-- five source-faithful domains, airy and modest -->
<path d="M158 644h484" stroke="#a79a80" stroke-width="1" opacity=".8"/>
<g font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif" fill="#4d504b" font-size="21" text-anchor="middle" letter-spacing="1.2">
 <text x="250" y="699">自分を律する</text><text x="550" y="699">人を大切にする</text>
 <text x="250" y="754">信頼を築く</text><text x="550" y="754">人と共に生きる</text>
 <text x="400" y="809">次世代につなぐ</text>
</g>
