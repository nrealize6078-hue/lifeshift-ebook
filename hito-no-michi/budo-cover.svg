<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1200" role="img" aria-labelledby="bookTitle bookDesc">
<title id="bookTitle">人の道 — 175日間の学び</title>
<desc id="bookDesc">静かな道場の障子と木刀、墨の円相を配した和の教科書の表紙。人物は描かれていません。</desc>
<defs>
 <linearGradient id="washi" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f0e7"/><stop offset=".65" stop-color="#eee9dc"/><stop offset="1" stop-color="#e8e1d1"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b7060" stop-opacity=".16"/><stop offset=".4" stop-color="#807261" stop-opacity=".26"/><stop offset="1" stop-color="#655a50" stop-opacity=".5"/></linearGradient>
 <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#343a36"/><stop offset="1" stop-color="#1e2c2f"/></linearGradient>
 <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".63" numOctaves="3" seed="9" stitchTiles="stitch"/></filter>
 <pattern id="streak" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M2 41h80M21 98h70" stroke="#71664e" stroke-width=".35" opacity=".2"/></pattern>
</defs>
<rect width="800" height="1200" fill="url(#washi)"/>
<rect width="800" height="1200" filter="url(#paper)" opacity=".11"/>
<rect width="800" height="1200" fill="url(#streak)" opacity=".4"/>
